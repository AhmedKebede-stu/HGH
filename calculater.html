<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>calculator by ahmed kebede </title>

  <style>

    * {

      margin: 0;

      padding: 0;
   

      box-sizing: border-box;

      font-family: 'Poppins', sans-serif;

    }

    body {
  background-image: url('ah.png');
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center center;
      height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background: linear-gradient(135deg, #1f1c2c, #928dab);

    }

    .calculator {

      width: 320px;

      background: #2c2c2c;

      padding: 20px;

      border-radius: 20px;

      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);

      animation: fadeIn 1s ease-in-out;

    }

    @keyframes fadeIn {

      from { opacity: 0; transform: translateY(-50px); }

      to { opacity: 1; transform: translateY(0); }

    }

    .calculator input {

      width: 100%;

      height: 60px;

      margin-bottom: 20px;

      border: none;

      border-radius: 10px;

      font-size: 24px;

      padding: 10px;

      text-align: right;

      background: #111;

      color: #00ffcc;

      outline: none;

      box-shadow: inset 0 0 10px #00ffcc, 0 0 20px #00ffcc;

      transition: box-shadow 0.3s;

    }

    .calculator input:focus {

      box-shadow: inset 0 0 15px #00ffcc, 0 0 25px #00ffcc;

    }

    .buttons {

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 15px;

    }

    .buttons button {

      height: 60px;

      font-size: 20px;

      font-weight: bold;

      border: none;

      border-radius: 12px;

      cursor: pointer;

      transition: transform 0.2s, box-shadow 0.3s;

    }

    .buttons button:hover {

      transform: scale(1.1);

    }

    .buttons button:active {

      transform: scale(0.95);

      box-shadow: 0 0 15px #00ffcc;

    }

    .btn-operator {

      background: #ff9500;

      color: #fff;

      box-shadow: 0 4px 10px rgba(255, 149, 0, 0.6);

    }

    .btn-clear {

      background: #ff3b30;

      color: #fff;

      box-shadow: 0 4px 10px rgba(255, 59, 48, 0.6);

    }

    .btn-equal {

      background: #34c759;

      color: #fff;

      grid-column: span 2;

      box-shadow: 0 4px 10px rgba(52, 199, 89, 0.6);

    }

    .btn-number {

      background: #333;

      color: #fff;

      box-shadow: 0 4px 10px rgba(0, 255, 204, 0.4);

    }

  </style>

</head>

<body>

  <div class="calculator">

    <input type="text" id="display" disabled>

    <div class="buttons">

      <button class="btn-clear" onclick="clearDisplay()">C</button>

      <button class="btn-operator" onclick="appendValue('/')">÷</button>

      <button class="btn-operator" onclick="appendValue('*')">×</button>

      <button class="btn-operator" onclick="appendValue('-')">−</button>

      <button class="btn-number" onclick="appendValue('7')">7</button>

      <button class="btn-number" onclick="appendValue('8')">8</button>

      <button class="btn-number" onclick="appendValue('9')">9</button>

      <button class="btn-operator" onclick="appendValue('+')">+</button>

      <button class="btn-number" onclick="appendValue('4')">4</button>

      <button class="btn-number" onclick="appendValue('5')">5</button>

      <button class="btn-number" onclick="appendValue('6')">6</button>

      <button class="btn-number" onclick="appendValue('.')">.</button>

      <button class="btn-number" onclick="appendValue('1')">1</button>

      <button class="btn-number" onclick="appendValue('2')">2</button>

      <button class="btn-number" onclick="appendValue('3')">3</button>

      <button class="btn-number" onclick="appendValue('0')">0</button>

      <button class="btn-equal" onclick="calculateResult()">=</button>

    </div>

  </div>

  <script>

    let display = document.getElementById("display");

    function appendValue(value) {

      display.value += value;

    }

    function clearDisplay() {

      display.value = "";

    }

    function calculateResult() {

      try {

        display.value = eval(display.value);

      } catch {

        display.value = "Error";

      }

    }

  </script>

</body>

</html>
